openapi: 3.0.3
info:
  title: Kaapi Estate API
  version: 1.0.0
  description: |
    Direct booking and enquiry routing for a 76-key coffee-estate resort.

    Conventions:
    - Money is integer paise (₹1 = 100 paise). Dates are `YYYY-MM-DD`; timestamps are RFC 3339.
    - Every error has the same envelope (`ErrorBody`), with a stable `code` to switch on.
    - Every response carries `X-Request-Id`; quote it when reporting a problem.
    - The gateway applies one policy per route group (`internal/transport/httpapi/policies.go`):
      cross-origin access (none for the payment webhook and the Gmail return; the web app only
      for `/v1/staff`; the web app and native shells elsewhere) and a rate limit, counted per
      signed-in account or per client IP. Over the limit: `429 RATE_LIMITED` with `Retry-After`
      (seconds) and `details.retry_after_seconds`.
    - A token is accepted only while its session is live: logging out, a refresh rotating it,
      or the account being deactivated ends it at once.

    This file is the contract. The API's contract test checks real responses against it,
    and the web app's TypeScript types are generated from it.
servers:
  - url: /
tags:
  - name: health
  - name: catalog
  - name: booking
  - name: auth
  - name: staff
  - name: payments
  - name: enquiries

paths:
  /healthz:
    get:
      tags: [health]
      summary: The process is up.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }
  /readyz:
    get:
      tags: [health]
      summary: The database is reachable.
      responses:
        "200": { description: Ready, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }
        "503": { $ref: "#/components/responses/Error" }

  /v1/property:
    get:
      tags: [catalog]
      summary: Resort basics and the fact sheet.
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/PropertyResponse" } } }

        "429": { $ref: "#/components/responses/Error" }
  /v1/fx-rates:
    get:
      tags: [catalog]
      summary: Exchange rates for showing an estimate in the guest's currency.
      description: >
        Every booking is charged in INR; these rates only turn an INR amount into an estimate
        ("≈ US$102"). ECB reference rates, refreshed every few hours. Rates older than 48 hours
        are left out, so an empty list means "show INR only".
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/FxRatesResponse" } } }

        "429": { $ref: "#/components/responses/Error" }
  /v1/rooms:
    get:
      tags: [catalog]
      summary: Every room type with photos and rate plans.
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/RoomsResponse" } } }

        "429": { $ref: "#/components/responses/Error" }
  /v1/rooms/{slug}:
    get:
      tags: [catalog]
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/RoomResponse" } } }
        "404": { $ref: "#/components/responses/Error" }

        "429": { $ref: "#/components/responses/Error" }
  /v1/rooms/{slug}/calendar:
    get:
      tags: [catalog]
      summary: Nightly prices and rooms left, for the price calendar.
      parameters:
        - { $ref: "#/components/parameters/Slug" }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, description: Exclusive. At most 42 days after `from`., schema: { type: string, format: date } }
        - { name: plan, in: query, schema: { type: string, default: RO-FLEX } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/CalendarResponse" } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

        "429": { $ref: "#/components/responses/Error" }
  /v1/availability:
    get:
      tags: [booking]
      summary: What can be booked for a stay, with prices for every plan.
      parameters:
        - { name: check_in, in: query, required: true, schema: { type: string, format: date } }
        - { name: check_out, in: query, required: true, schema: { type: string, format: date } }
        - { name: rooms, in: query, schema: { type: integer, minimum: 1, maximum: 4, default: 1 } }
        - { name: adults, in: query, schema: { type: integer, minimum: 1, maximum: 16, default: 2 } }
        - { name: children, in: query, schema: { type: integer, minimum: 0, maximum: 8, default: 0 } }
        - { name: promo, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/AvailabilityResponse" } } }
        "422": { $ref: "#/components/responses/Error" }

        "429": { $ref: "#/components/responses/Error" }
  /v1/holds:
    post:
      tags: [booking]
      summary: Hold rooms while the guest checks out.
      description: |
        Locks the stay's nights, re-checks capacity and freezes the price. Concurrent requests
        for the last room are serialised; exactly one wins and the rest get `SOLD_OUT`, with
        `details.nights` and `details.alternatives` (nearby check-in dates that work).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateHoldRequest" } } }
      responses:
        "201":
          description: Held
          content: { application/json: { schema: { $ref: "#/components/schemas/HoldResponse" } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

        "429": { $ref: "#/components/responses/Error" }
  /v1/holds/{id}:
    delete:
      tags: [booking]
      summary: Give the rooms back early.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Hold-Token, in: header, required: true, schema: { type: string } }
      responses:
        "204": { description: Released }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/staff/login:
    post:
      tags: [auth]
      summary: Staff sign in with email and password.
      parameters: [{ $ref: "#/components/parameters/XClient" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StaffLoginRequest" } } }
      responses:
        "200": { $ref: "#/components/responses/SignedIn" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/otp/request:
    post:
      tags: [auth]
      summary: Email a guest a 6-digit sign-in code.
      description: Answers the same way whether or not the email has an account. In demo mode the code is also returned.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OTPRequest" } } }
      responses:
        "202":
          description: Sent
          content: { application/json: { schema: { $ref: "#/components/schemas/OTPRequestResponse" } } }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/otp/verify:
    post:
      tags: [auth]
      summary: Sign a guest in with the code.
      parameters: [{ $ref: "#/components/parameters/XClient" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OTPVerifyRequest" } } }
      responses:
        "200": { $ref: "#/components/responses/SignedIn" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token and issue a new access token.
      description: |
        Web: uses the refresh cookie. Native: send `X-Client: native` and `{"refresh_token": "..."}`.
        Reusing an already-rotated refresh token revokes every session of that user.
      parameters: [{ $ref: "#/components/parameters/XClient" }]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/RefreshRequest" } } }
      responses:
        "200": { $ref: "#/components/responses/SignedIn" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/auth/logout:
    post:
      tags: [auth]
      responses:
        "204": { description: Signed out }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/me:
    get:
      tags: [auth]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/MeResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/staff/outbox:
    get:
      tags: [staff]
      summary: Messages the system has sent (email and WhatsApp are simulated).
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/OutboxResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

        "429": { $ref: "#/components/responses/Error" }
  /v1/bookings:
    post:
      tags: [booking]
      summary: Turn a hold into a booking awaiting payment.
      description: Submitting twice for the same hold returns the same booking. The price is the hold's frozen quote.
      parameters:
        - { name: X-Hold-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateBookingRequest" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/BookingResponse" } } }
        "404": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/bookings/{ref}:
    get:
      tags: [booking]
      summary: One booking, for the browser that made it (X-Hold-Token), its signed-in guest, or staff.
      parameters:
        - { name: ref, in: path, required: true, schema: { type: string, example: KS-7Q3M9X } }
        - { name: X-Hold-Token, in: header, schema: { type: string } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/BookingResponse" } } }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/me/bookings:
    get:
      tags: [booking]
      summary: A signed-in guest's bookings.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/BookingsResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/payments/{orderId}:
    get:
      tags: [payments]
      summary: What the mock payment page shows.
      parameters: [{ $ref: "#/components/parameters/OrderID" }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/PaymentPage" } } }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/payments/{orderId}/simulate:
    post:
      tags: [payments]
      summary: Mock gateway. Signs a webhook event for the chosen outcome and delivers it.
      parameters: [{ $ref: "#/components/parameters/OrderID" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SimulatePaymentRequest" } } }
      responses:
        "200":
          description: Processed
          content: { application/json: { schema: { $ref: "#/components/schemas/PaymentPage" } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/payments/webhook:
    post:
      tags: [payments]
      summary: Provider webhook, signed with HMAC-SHA256 in X-Mock-Signature. Idempotent by event id.
      parameters:
        - { name: X-Mock-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PaymentEvent" } } }
      responses:
        "200":
          description: Received
          content: { application/json: { schema: { type: object, required: [received], properties: { received: { type: boolean } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/staff/bookings:
    get:
      tags: [staff]
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: from, in: query, description: Check-in on or after., schema: { type: string, format: date } }
        - { name: to, in: query, description: Check-in before., schema: { type: string, format: date } }
        - { name: archived, in: query, description: true lists the archive (finished stays) instead of live bookings., schema: { type: boolean, default: false } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/BookingsResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/staff/bookings/export:
    get:
      tags: [staff]
      summary: Bookings confirmed or cancelled on a day (IST), as CSV for the reservation system.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: CSV, one row per booking.
          content: { text/csv: { schema: { type: string } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

        "429": { $ref: "#/components/responses/Error" }
  /v1/staff/rates:
    get:
      tags: [staff]
      summary: Prices and allotment for every room type across a range of nights.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, description: Exclusive. At most 62 nights after from., schema: { type: string, format: date } }
        - { name: plan, in: query, schema: { type: string, default: RO-FLEX } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/RatesGridResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    put:
      tags: [staff]
      summary: Bulk-edit a room type's nights. Fields left out stay as they are.
      description: |
        The room-only price drives every other plan (breakfast adds a fixed amount; non-refundable takes a discount).
        Allotment can't go below rooms already sold or on hold (`ALLOTMENT_TOO_LOW`). Every edit is audit-logged.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateRatesRequest" } } }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/UpdateRatesResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

        "429": { $ref: "#/components/responses/Error" }
  /v1/enquiries:
    post:
      tags: [enquiries]
      summary: The website's enquiry and event forms. The AI reads it within seconds; staff reply.
      description: A repeat of the same message from the same sender within a day returns the first reference.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateEnquiryRequest" } } }
      responses:
        "201":
          description: Received.
          content: { application/json: { schema: { $ref: "#/components/schemas/EnquiryCreatedResponse" } } }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /v1/staff/inbound:
    post:
      tags: [enquiries]
      summary: Simulated email or WhatsApp message. Enters the same pipeline a real webhook would feed.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/InboundMessageRequest" } } }
      responses:
        "201":
          description: Received.
          content: { application/json: { schema: { $ref: "#/components/schemas/EnquiryCreatedResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/staff/enquiries:
    get:
      tags: [enquiries]
      summary: The inbox. Reservations and Sales see their own lane; the GM sees every lane, including Unsorted.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: lane, in: query, schema: { $ref: "#/components/schemas/Lane" } }
        - { name: status, in: query, description: "Default: everything open (not closed or spam).", schema: { $ref: "#/components/schemas/EnquiryStatus" } }
        - { name: q, in: query, description: "Search text, sender or reference.", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 300, default: 100 } }
      responses:
        "200":
          description: Complaints waiting for a reply first, then newest.
          content: { application/json: { schema: { $ref: "#/components/schemas/EnquiriesResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/staff/inbox/stream:
    get:
      tags: [enquiries]
      summary: Live inbox updates (server-sent events). One "inbox" event, data = the enquiry ref, whenever an enquiry or its draft changes; refetch with your own permissions.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: An open event stream.
          content: { text/event-stream: { schema: { type: string } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/staff/enquiries/{ref}:
    parameters: [{ $ref: "#/components/parameters/EnquiryRef" }]
    get:
      tags: [enquiries]
      summary: One enquiry with the AI's reading, the latest draft and its history. Outside your lanes it is 404.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/EnquiryResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/staff/enquiries/{ref}/route:
    parameters: [{ $ref: "#/components/parameters/EnquiryRef" }]
    post:
      tags: [enquiries]
      summary: One-click re-route, optionally correcting the category (which writes a fresh draft).
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RouteEnquiryRequest" } } }
      responses:
        "200":
          description: The enquiry after the change.
          content: { application/json: { schema: { $ref: "#/components/schemas/EnquiryResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/staff/enquiries/{ref}/fields:
    parameters: [{ $ref: "#/components/parameters/EnquiryRef" }]
    patch:
      tags: [enquiries]
      summary: Correct what the AI extracted. The draft's quote is re-priced from the rate table.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CorrectEnquiryRequest" } } }
      responses:
        "200":
          description: The enquiry after the change.
          content: { application/json: { schema: { $ref: "#/components/schemas/EnquiryResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/staff/enquiries/{ref}/draft:
    parameters: [{ $ref: "#/components/parameters/EnquiryRef" }]
    put:
      tags: [enquiries]
      summary: Save the staff member's edit as the next draft version.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EditDraftRequest" } } }
      responses:
        "200":
          description: The enquiry after the change.
          content: { application/json: { schema: { $ref: "#/components/schemas/EnquiryResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/staff/enquiries/{ref}/send:
    parameters: [{ $ref: "#/components/parameters/EnquiryRef" }]
    post:
      tags: [enquiries]
      summary: Send the latest draft. The only way a reply reaches a guest; nothing is sent automatically. Email goes out through Gmail when connected (in the guest's thread), otherwise it is simulated.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: The enquiry after the change.
          content: { application/json: { schema: { $ref: "#/components/schemas/EnquiryResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/staff/enquiries/{ref}/status:
    parameters: [{ $ref: "#/components/parameters/EnquiryRef" }]
    post:
      tags: [enquiries]
      summary: Close, reopen or mark as spam.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EnquiryStatusRequest" } } }
      responses:
        "200":
          description: The enquiry after the change.
          content: { application/json: { schema: { $ref: "#/components/schemas/EnquiryResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/staff/enquiries/{ref}/retry-ai:
    parameters: [{ $ref: "#/components/parameters/EnquiryRef" }]
    post:
      tags: [enquiries]
      summary: Queue the enquiry for the AI again (after an outage, or when it fell back to keyword rules).
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: The enquiry after the change.
          content: { application/json: { schema: { $ref: "#/components/schemas/EnquiryResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/staff/dashboard:
    get:
      tags: [staff]
      summary: The numbers behind the brief's success measures.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/DashboardResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/staff/integrations/gmail:
    get:
      tags: [staff]
      summary: Whether a Gmail mailbox is connected to the inbox.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/GmailStatusResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    delete:
      tags: [staff]
      summary: Disconnect the mailbox and revoke Google's grant. Replies go back to being simulated.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: The status after disconnecting.
          content: { application/json: { schema: { $ref: "#/components/schemas/GmailStatusResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/staff/integrations/gmail/connect:
    post:
      tags: [staff]
      summary: Start connecting a mailbox. Returns Google's consent URL to open in the browser.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/GmailConnectResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/staff/integrations/gmail/sync:
    post:
      tags: [staff]
      summary: Import everything that reached the mailbox since the last successful sync (catches up after downtime; never duplicates).
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: How many emails became enquiries.
          content: { application/json: { schema: { $ref: "#/components/schemas/GmailSyncResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/integrations/gmail/callback:
    get:
      tags: [staff]
      summary: Google's OAuth redirect. Always answers with a redirect back to the staff inbox.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: "To /staff/inbox?gmail=connected|cancelled|error." }
        "429": { $ref: "#/components/responses/Error" }
  /v1/staff/messages:
    post:
      tags: [staff]
      summary: Send a new email written by staff (not a reply). Goes out through Gmail when connected; otherwise simulated.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ComposeRequest" } } }
      responses:
        "201":
          description: The outbox copy.
          content: { application/json: { schema: { $ref: "#/components/schemas/OutboxMessageResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/staff/access:
    get:
      tags: [access]
      summary: The permission catalogue and every role with what it grants (administrator).
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/staff/roles:
    post:
      tags: [access]
      summary: Create a role for a team with the permissions it grants.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RoleRequest" } } }
      responses:
        "201":
          description: The new role.
          content: { application/json: { schema: { $ref: "#/components/schemas/RoleResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/staff/roles/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put:
      tags: [access]
      summary: Change a role's name, team and permissions. Takes effect within seconds for everyone with it.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RoleRequest" } } }
      responses:
        "200":
          description: The role after the change.
          content: { application/json: { schema: { $ref: "#/components/schemas/RoleResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    delete:
      tags: [access]
      summary: Delete a role nobody has.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/staff/users:
    get:
      tags: [access]
      summary: Every staff account.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/MembersResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    post:
      tags: [access]
      summary: Create a staff account with a role and a starting password.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateMemberRequest" } } }
      responses:
        "201":
          description: The new account.
          content: { application/json: { schema: { $ref: "#/components/schemas/MemberResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/staff/users/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    patch:
      tags: [access]
      summary: Change a person's name, role, password or whether they can sign in. Role changes, deactivation and password resets sign them out everywhere.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateMemberRequest" } } }
      responses:
        "200":
          description: The account after the change.
          content: { application/json: { schema: { $ref: "#/components/schemas/MemberResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/staff/analytics:
    get:
      tags: [staff]
      summary: Revenue, booking pace, mix and what's already sold for the months ahead.
      description: >-
        KPIs count confirmed bookings (archived included) made in the range, by booked date in IST.
        Commission saved is an estimate at the brief's ~20% agency commission. On-the-books covers this
        month and the next five by stay date, against the website's allotment.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: from, in: query, description: First booked date (default 89 days before to)., schema: { type: string, format: date } }
        - { name: to, in: query, description: Last booked date (default today in IST)., schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/AnalyticsResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/staff/retention/run:
    post:
      tags: [staff]
      summary: Run the retention sweep now (it also runs on a schedule) and report what changed.
      description: >-
        Archives bookings whose stay is over, wipes guest contact details 12 months after check-out,
        deletes archived bookings after the tax window (8 financial years), and deletes enquiries,
        message copies, unpaid bookings, old holds, OTP codes and sessions past their windows. Idempotent.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: What the sweep changed.
          content: { application/json: { schema: { $ref: "#/components/schemas/RetentionResponse" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

        "429": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: kaapi_at, description: "Web. In production the cookie is __Host-kaapi_at." }
    bearerAuth: { type: http, scheme: bearer, description: "Native app. Encrypted JWE access token, valid 15 minutes." }

  parameters:
    OrderID:
      name: orderId
      in: path
      required: true
      schema: { type: string, pattern: "^order_[0-9a-f]+$" }
    XClient:
      name: X-Client
      in: header
      description: Send `native` to receive tokens in the body instead of cookies.
      schema: { type: string, enum: [native] }
    EnquiryRef:
      name: ref
      in: path
      required: true
      description: Case-insensitive.
      schema: { type: string, pattern: "^[Ee][Nn][Qq]-[0-9]{4,}$" }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }

  responses:
    SignedIn:
      description: Signed in. The web gets httpOnly cookies; the native app also gets tokens in the body.
      content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } }
    Error:
      description: Something went wrong. `code` says what.
      headers:
        X-Request-Id: { schema: { type: string } }
        Retry-After: { description: "On 429: seconds until the limit resets.", schema: { type: integer } }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorBody" } } }

  schemas:
    Status:
      type: object
      required: [status]
      properties: { status: { type: string } }

    ErrorBody:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string, description: Safe to show to people. }
            details: { type: object, additionalProperties: true }
            request_id: { type: string }

    ErrorCode:
      type: string
      enum: [BAD_REQUEST, VALIDATION_FAILED, PAYLOAD_TOO_LARGE, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND,
        METHOD_NOT_ALLOWED, CONFLICT, RATE_LIMITED, IDEMPOTENCY_MISMATCH, INVALID_STAY, NOT_ON_SALE, SOLD_OUT,
        STAY_RESTRICTED, PROMO_INVALID, TOO_MANY_GUESTS, HOLD_NOT_FOUND, HOLD_EXPIRED, ALLOTMENT_TOO_LOW,
        CLIENT_CLOSED_REQUEST, TIMEOUT, SERVICE_UNAVAILABLE, INTERNAL]

    Date: { type: string, format: date }
    Paise: { type: integer, format: int64, minimum: 0, description: "Rupees × 100." }

    Fact:
      type: object
      required: [key, category, question, answer]
      properties:
        key: { type: string }
        category: { type: string }
        question: { type: string }
        answer: { type: string }

    PropertyResponse:
      type: object
      required: [name, check_in_time, check_out_time, hold_minutes, facts]
      properties:
        name: { type: string }
        check_in_time: { type: string, example: "14:00" }
        check_out_time: { type: string, example: "11:00" }
        hold_minutes: { type: integer }
        facts: { type: array, items: { $ref: "#/components/schemas/Fact" } }

    Currency:
      type: string
      enum: [INR, USD, EUR, GBP, AUD, CAD, SGD, CHF, JPY]

    FxRate:
      type: object
      required: [currency, inr_per_unit_micros, date]
      additionalProperties: false
      properties:
        currency: { $ref: "#/components/schemas/Currency" }
        inr_per_unit_micros: { type: integer, format: int64, minimum: 1, description: "INR per one unit of the currency × 1,000,000." }
        date: { type: string, format: date, description: The ECB publication date. }

    FxRatesResponse:
      type: object
      required: [charged_in, rates]
      additionalProperties: false
      properties:
        charged_in: { type: string, enum: [INR], description: Bookings are always charged in this currency. }
        rates: { type: array, items: { $ref: "#/components/schemas/FxRate" } }

    Photo:
      type: object
      required: [url, alt]
      properties: { url: { type: string }, alt: { type: string } }

    Plan:
      type: object
      required: [id, code, name, inclusions, refundable, cancellation_policy, min_nights]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: BB-FLEX }
        name: { type: string }
        inclusions: { type: array, items: { type: string } }
        refundable: { type: boolean }
        cancellation_policy: { type: string, enum: [FREE_UNTIL_7_DAYS, NON_REFUNDABLE] }
        min_nights: { type: integer, minimum: 1 }

    Room:
      type: object
      required: [id, slug, name, kind, size_sqm, bed, view, sleeps, extra_adult_paise, summary, description, amenities, photos, plans]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        kind: { type: string, enum: [ROOM, VILLA] }
        size_sqm: { type: integer }
        bed: { type: string }
        view: { type: string }
        sleeps:
          type: object
          required: [adults, children]
          properties: { adults: { type: integer }, children: { type: integer } }
        extra_adult_paise: { $ref: "#/components/schemas/Paise" }
        summary: { type: string }
        description: { type: string }
        amenities: { type: array, items: { type: string } }
        photos: { type: array, items: { $ref: "#/components/schemas/Photo" } }
        plans: { type: array, items: { $ref: "#/components/schemas/Plan" } }

    RoomsResponse:
      type: object
      required: [rooms]
      properties: { rooms: { type: array, items: { $ref: "#/components/schemas/Room" } } }

    RoomResponse:
      type: object
      required: [room]
      properties: { room: { $ref: "#/components/schemas/Room" } }

    CalendarDay:
      type: object
      required: [date, price_paise, left, min_stay, stop_sell, no_arrival, season]
      properties:
        date: { $ref: "#/components/schemas/Date" }
        price_paise: { $ref: "#/components/schemas/Paise" }
        left: { type: integer, minimum: 0 }
        min_stay: { type: integer, minimum: 1 }
        stop_sell: { type: boolean }
        no_arrival: { type: boolean }
        season: { type: boolean, description: Priced above the usual rate for that weekday. }

    CalendarResponse:
      type: object
      required: [plan, days]
      properties:
        plan: { type: string }
        days: { type: array, items: { $ref: "#/components/schemas/CalendarDay" } }

    Stay:
      type: object
      required: [check_in, check_out, nights]
      properties:
        check_in: { $ref: "#/components/schemas/Date" }
        check_out: { $ref: "#/components/schemas/Date" }
        nights: { type: integer, minimum: 1 }

    QuoteLine:
      type: object
      required: [date, room_paise, discount_paise, taxable_paise, gst_rate_bps, gst_paise, total_paise]
      properties:
        date: { $ref: "#/components/schemas/Date" }
        room_paise: { $ref: "#/components/schemas/Paise" }
        discount_paise: { $ref: "#/components/schemas/Paise" }
        taxable_paise: { $ref: "#/components/schemas/Paise" }
        gst_rate_bps: { type: integer, description: "500 = 5%, 1800 = 18%" }
        gst_paise: { $ref: "#/components/schemas/Paise" }
        total_paise: { $ref: "#/components/schemas/Paise" }

    Quote:
      type: object
      required: [lines, subtotal_paise, discount_paise, tax_paise, total_paise, promo_code]
      properties:
        lines: { type: array, items: { $ref: "#/components/schemas/QuoteLine" } }
        subtotal_paise: { $ref: "#/components/schemas/Paise" }
        discount_paise: { $ref: "#/components/schemas/Paise" }
        tax_paise: { $ref: "#/components/schemas/Paise" }
        total_paise: { $ref: "#/components/schemas/Paise" }
        promo_code: { type: string, nullable: true }

    PlanQuote:
      type: object
      required: [plan_id, code, name, refundable, quote]
      properties:
        plan_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        refundable: { type: boolean }
        quote: { $ref: "#/components/schemas/Quote" }

    Option:
      type: object
      required: [room_type_id, slug, name, status, left, reason, sold_out_nights, min_stay, promo_error, plans]
      properties:
        room_type_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        status: { type: string, enum: [AVAILABLE, SOLD_OUT, RESTRICTED, TOO_MANY_GUESTS, NOT_ON_SALE] }
        left: { type: integer, minimum: 0, description: Fewest website rooms free on any night. }
        reason: { type: string, nullable: true }
        sold_out_nights: { type: array, items: { $ref: "#/components/schemas/Date" } }
        min_stay: { type: integer }
        promo_error: { type: string, nullable: true }
        plans: { type: array, items: { $ref: "#/components/schemas/PlanQuote" } }

    AvailabilityResponse:
      type: object
      required: [stay, options]
      properties:
        stay: { $ref: "#/components/schemas/Stay" }
        options: { type: array, items: { $ref: "#/components/schemas/Option" } }

    CreateHoldRequest:
      type: object
      required: [room_type_id, rate_plan_id, check_in, check_out, adults]
      additionalProperties: false
      properties:
        room_type_id: { type: string, format: uuid }
        rate_plan_id: { type: string, format: uuid }
        check_in: { $ref: "#/components/schemas/Date" }
        check_out: { $ref: "#/components/schemas/Date" }
        rooms: { type: integer, minimum: 1, maximum: 4, default: 1 }
        adults: { type: integer, minimum: 1 }
        children: { type: integer, minimum: 0, default: 0 }
        promo_code: { type: string }

    Hold:
      type: object
      required: [id, room_type_id, rate_plan_id, stay, rooms, expires_at, quote]
      properties:
        id: { type: string, format: uuid }
        token: { type: string, description: Returned once. Send it as X-Hold-Token to book or release. }
        room_type_id: { type: string, format: uuid }
        rate_plan_id: { type: string, format: uuid }
        stay: { $ref: "#/components/schemas/Stay" }
        rooms: { type: integer }
        expires_at: { type: string, format: date-time }
        quote: { $ref: "#/components/schemas/Quote" }

    HoldResponse:
      type: object
      required: [hold]
      properties: { hold: { $ref: "#/components/schemas/Hold" } }

    User:
      type: object
      required: [id, email, name, role, permissions]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [GUEST, RESERVATIONS, SALES, GM, ADMIN] }
        permissions: { type: array, items: { type: string } }

    AuthResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/User" }
        access_token: { type: string }
        access_expires_at: { type: string, format: date-time }
        refresh_token: { type: string }

    MeResponse:
      type: object
      required: [user]
      properties: { user: { $ref: "#/components/schemas/User" } }

    StaffLoginRequest:
      type: object
      required: [email, password]
      properties: { email: { type: string }, password: { type: string } }

    OTPRequest:
      type: object
      required: [email]
      properties: { email: { type: string } }

    OTPRequestResponse:
      type: object
      required: [sent]
      properties:
        sent: { type: boolean }
        demo_code: { type: string, description: Only when DEMO_MODE is on. }

    OTPVerifyRequest:
      type: object
      required: [email, code]
      properties: { email: { type: string }, code: { type: string } }

    RefreshRequest:
      type: object
      properties: { refresh_token: { type: string } }

    OutboxMessage:
      type: object
      required: [id, channel, kind, status, recipient, subject, body, created_at]
      properties:
        id: { type: string, format: uuid }
        channel: { type: string, enum: [EMAIL, WHATSAPP, SMS] }
        kind: { type: string, enum: [OTP, BOOKING_CONFIRMATION, ENQUIRY_REPLY, ALERT, REFUND_NOTICE, STAFF_MESSAGE] }
        status: { type: string, enum: [SIMULATED, SENT, FAILED], description: SENT went out through the connected mailbox; SIMULATED was only recorded. }
        recipient: { type: string }
        subject: { type: string, nullable: true }
        body: { type: string }
        created_at: { type: string, format: date-time }

    OutboxResponse:
      type: object
      required: [messages]
      properties: { messages: { type: array, items: { $ref: "#/components/schemas/OutboxMessage" } } }

    Guest:
      type: object
      required: [name, email, phone, country]
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        country: { type: string, description: ISO 3166 alpha-2. }

    CreateBookingRequest:
      type: object
      required: [hold_id, guest, consent]
      additionalProperties: false
      properties:
        hold_id: { type: string, format: uuid }
        guest: { $ref: "#/components/schemas/Guest" }
        arrival_window: { type: string }
        special_requests: { type: string, maxLength: 1000 }
        consent: { type: boolean, description: "DPDP consent to use these details for the booking. Must be true." }
        marketing_opt_in: { type: boolean }
        display_currency:
          allOf: [{ $ref: "#/components/schemas/Currency" }]
          description: The currency the guest was reading prices in, kept with that moment's rate for analytics. The charge is INR regardless.

    Payment:
      type: object
      required: [order_id, status, amount_paise, failure_reason]
      properties:
        order_id: { type: string }
        status: { type: string, enum: [CREATED, CAPTURED, FAILED, REFUND_PENDING, REFUNDED] }
        amount_paise: { $ref: "#/components/schemas/Paise" }
        failure_reason: { type: string, nullable: true }

    BookingStatus:
      type: string
      enum: [PENDING_PAYMENT, CONFIRMED, PAYMENT_FAILED, EXPIRED, CANCELLED, REFUND_PENDING, REFUNDED]

    Booking:
      type: object
      required: [ref, status, room, plan, stay, rooms, adults, children, guest, arrival_window, special_requests, quote,
        hold_expires_at, created_at, confirmed_at, archived_at, payment]
      properties:
        ref: { type: string }
        status: { $ref: "#/components/schemas/BookingStatus" }
        room:
          type: object
          required: [id, slug, name]
          properties: { id: { type: string, format: uuid }, slug: { type: string }, name: { type: string } }
        plan:
          type: object
          required: [name, refundable]
          properties: { name: { type: string }, refundable: { type: boolean } }
        stay: { $ref: "#/components/schemas/Stay" }
        rooms: { type: integer }
        adults: { type: integer }
        children: { type: integer }
        guest: { $ref: "#/components/schemas/Guest" }
        arrival_window: { type: string, nullable: true }
        special_requests: { type: string, nullable: true }
        quote: { $ref: "#/components/schemas/Quote" }
        hold_expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        confirmed_at: { type: string, format: date-time, nullable: true }
        archived_at: { type: string, format: date-time, nullable: true, description: Set once the stay is over; archived bookings are kept for the tax window. }
        payment:
          allOf: [{ $ref: "#/components/schemas/Payment" }]
          nullable: true

    BookingResponse:
      type: object
      required: [booking]
      properties: { booking: { $ref: "#/components/schemas/Booking" } }

    BookingsResponse:
      type: object
      required: [bookings]
      properties: { bookings: { type: array, items: { $ref: "#/components/schemas/Booking" } } }

    PaymentPage:
      type: object
      required: [order_id, amount_paise, status, failure_reason, booking_ref, booking_status, room_name, plan_name, stay, hold_expires_at]
      properties:
        order_id: { type: string }
        amount_paise: { $ref: "#/components/schemas/Paise" }
        status: { type: string }
        failure_reason: { type: string, nullable: true }
        booking_ref: { type: string }
        booking_status: { $ref: "#/components/schemas/BookingStatus" }
        room_name: { type: string }
        plan_name: { type: string }
        stay: { $ref: "#/components/schemas/Stay" }
        hold_expires_at: { type: string, format: date-time, nullable: true }

    SimulatePaymentRequest:
      type: object
      required: [outcome]
      properties: { outcome: { type: string, enum: [SUCCESS, FAILURE] } }

    PaymentEvent:
      type: object
      required: [id, type, provider, order_id, payment_id, amount_paise, created_at]
      properties:
        id: { type: string }
        type: { type: string, enum: [payment.captured, payment.failed] }
        provider: { type: string }
        order_id: { type: string }
        payment_id: { type: string }
        amount_paise: { $ref: "#/components/schemas/Paise" }
        failure_reason: { type: string }
        created_at: { type: string, format: date-time }

    RateNight:
      type: object
      required: [date, price_paise, allotment, sold, held, left, stop_sell, stop_sell_reason, min_stay, no_arrival]
      properties:
        date: { $ref: "#/components/schemas/Date" }
        price_paise: { $ref: "#/components/schemas/Paise" }
        allotment: { type: integer }
        sold: { type: integer }
        held: { type: integer }
        left: { type: integer }
        stop_sell: { type: boolean }
        stop_sell_reason: { type: string, nullable: true }
        min_stay: { type: integer }
        no_arrival: { type: boolean }

    RateRow:
      type: object
      required: [room_type_id, slug, name, total_keys, nights]
      properties:
        room_type_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        total_keys: { type: integer }
        nights: { type: array, items: { $ref: "#/components/schemas/RateNight" } }

    RatesGridResponse:
      type: object
      required: [plan, stay, rows]
      properties:
        plan: { type: string }
        stay: { $ref: "#/components/schemas/Stay" }
        rows: { type: array, items: { $ref: "#/components/schemas/RateRow" } }

    UpdateRatesRequest:
      type: object
      required: [room_type_id, from, to]
      additionalProperties: false
      properties:
        room_type_id: { type: string, format: uuid }
        from: { $ref: "#/components/schemas/Date" }
        to: { $ref: "#/components/schemas/Date" }
        weekdays: { type: array, items: { type: string, enum: [MON, TUE, WED, THU, FRI, SAT, SUN] } }
        room_only_price_paise: { type: integer, format: int64, minimum: 1 }
        allotment: { type: integer, minimum: 0 }
        stop_sell: { type: boolean }
        stop_sell_reason: { type: string, maxLength: 120 }
        min_stay: { type: integer, minimum: 1, maximum: 14 }
        no_arrival: { type: boolean }

    UpdateRatesResponse:
      type: object
      required: [nights_changed]
      properties: { nights_changed: { type: integer } }

    Category: { type: string, enum: [ROOM, WEDDING, OFFSITE, COMPLAINT, OTHER] }
    Lane: { type: string, enum: [RESERVATIONS, SALES, GM, UNSORTED] }
    EnquiryStatus: { type: string, enum: [NEW, IN_PROGRESS, REPLIED, CLOSED, SPAM] }
    Channel: { type: string, enum: [WEB_FORM, EMAIL, WHATSAPP, EVENT_FORM] }
    AIStatus:
      type: string
      enum: [PENDING, DONE, FALLBACK, FAILED]
      description: "DONE: the model and keyword rules both ran. FALLBACK: keyword rules only (model off or unavailable)."

    EventDetails:
      type: object
      additionalProperties: false
      properties:
        type: { type: string, description: "wedding, engagement, offsite, …" }
        date: { type: string }
        month: { type: string, description: "YYYY-MM when there is no exact date." }
        guest_count: { type: integer, minimum: 0 }
        nights: { type: integer, minimum: 0 }
        budget_paise: { type: integer, format: int64, minimum: 0 }

    CreateEnquiryRequest:
      type: object
      additionalProperties: false
      description: An email or a phone is required so we can reply. Kind EVENT uses `event`.
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: string }
        phone: { type: string }
        message: { type: string, maxLength: 5000 }
        kind: { type: string, enum: [GENERAL, EVENT] }
        event: { $ref: "#/components/schemas/EventDetails" }

    EnquiryCreatedResponse:
      type: object
      required: [ref]
      properties: { ref: { type: string } }

    InboundMessageRequest:
      type: object
      required: [channel, text]
      additionalProperties: false
      properties:
        channel: { type: string, enum: [EMAIL, WHATSAPP] }
        sender_name: { type: string }
        sender_email: { type: string }
        sender_phone: { type: string }
        subject: { type: string }
        text: { type: string, maxLength: 5000 }

    EnquirySummary:
      type: object
      required: [ref, channel, sender_name, snippet, received_at, category, confidence, lane, status, priority, ai_status,
        needs_check, has_draft]
      properties:
        ref: { type: string }
        channel: { $ref: "#/components/schemas/Channel" }
        sender_name: { type: string, nullable: true }
        snippet: { type: string }
        received_at: { type: string, format: date-time }
        category: { type: string, enum: [ROOM, WEDDING, OFFSITE, COMPLAINT, OTHER], nullable: true }
        confidence: { type: number, minimum: 0, maximum: 1, nullable: true }
        lane: { $ref: "#/components/schemas/Lane" }
        status: { $ref: "#/components/schemas/EnquiryStatus" }
        priority: { type: string, enum: [NORMAL, HIGH] }
        ai_status: { $ref: "#/components/schemas/AIStatus" }
        needs_check: { type: boolean, description: "The AI is unsure, or a stay enquiry has no dates." }
        has_draft: { type: boolean }

    EnquiriesResponse:
      type: object
      required: [enquiries]
      properties: { enquiries: { type: array, items: { $ref: "#/components/schemas/EnquirySummary" } } }

    Extracted:
      type: object
      required: [check_in, check_out, nights, adults, children, rooms, guest_count, budget_paise, budget_basis, event_month]
      properties:
        check_in: { type: string, format: date, nullable: true }
        check_out: { type: string, format: date, nullable: true }
        nights: { type: integer, nullable: true }
        adults: { type: integer, nullable: true }
        children: { type: integer, nullable: true }
        rooms: { type: integer, nullable: true }
        guest_count: { type: integer, nullable: true }
        budget_paise: { type: integer, format: int64, nullable: true }
        budget_basis: { type: string, enum: [PER_NIGHT, TOTAL], nullable: true }
        event_month: { type: string, nullable: true }

    Draft:
      type: object
      required: [version, body, author, flagged_reason, quote_filled, created_at, sent_at]
      properties:
        version: { type: integer, minimum: 1 }
        body: { type: string, description: "Exactly what will be sent. Prices in it come from the rate table." }
        author: { type: string, enum: [AI, USER] }
        flagged_reason: { type: string, nullable: true, description: "Why the system changed the AI's text, e.g. it wrote a price itself." }
        quote_filled: { type: boolean, description: "True when the body contains a live quote." }
        created_at: { type: string, format: date-time }
        sent_at: { type: string, format: date-time, nullable: true }

    EnquiryEvent:
      type: object
      required: [type, actor, actor_name, from, to, created_at]
      properties:
        type:
          type: string
          enum: [RECEIVED, CLASSIFIED, REROUTED, CATEGORY_CHANGED, FIELDS_CORRECTED, ASSIGNED, DRAFT_CREATED, DRAFT_EDITED, SENT, ALERTED, CLOSED]
        actor: { type: string, enum: [AI, SYSTEM, USER] }
        actor_name: { type: string, nullable: true }
        from: { type: object, nullable: true, additionalProperties: true }
        to: { type: object, nullable: true, additionalProperties: true }
        created_at: { type: string, format: date-time }

    Enquiry:
      type: object
      required: [ref, channel, sender_name, sender_email, sender_phone, subject, text, received_at, language, category,
        secondary_category, confidence, ai_reason, summary, extracted, lane, assigned_to, priority, status, ai_status,
        ai_model, first_reply_at, draft, events]
      properties:
        ref: { type: string }
        channel: { $ref: "#/components/schemas/Channel" }
        sender_name: { type: string, nullable: true }
        sender_email: { type: string, nullable: true }
        sender_phone: { type: string, nullable: true }
        subject: { type: string, nullable: true }
        text: { type: string }
        received_at: { type: string, format: date-time }
        language: { type: string, nullable: true }
        category: { type: string, enum: [ROOM, WEDDING, OFFSITE, COMPLAINT, OTHER], nullable: true }
        secondary_category: { type: string, enum: [ROOM, WEDDING, OFFSITE, COMPLAINT, OTHER], nullable: true }
        confidence: { type: number, minimum: 0, maximum: 1, nullable: true }
        ai_reason: { type: string, description: "Why the confidence is what it is." }
        summary: { type: string, nullable: true }
        extracted: { $ref: "#/components/schemas/Extracted" }
        lane: { $ref: "#/components/schemas/Lane" }
        assigned_to:
          type: object
          nullable: true
          required: [id, name, role]
          properties: { id: { type: string, format: uuid }, name: { type: string }, role: { type: string } }
        priority: { type: string, enum: [NORMAL, HIGH] }
        status: { $ref: "#/components/schemas/EnquiryStatus" }
        ai_status: { $ref: "#/components/schemas/AIStatus" }
        ai_model: { type: string, nullable: true }
        first_reply_at: { type: string, format: date-time, nullable: true }
        draft:
          nullable: true
          type: object
          required: [version, body, author, flagged_reason, quote_filled, created_at, sent_at]
          properties:
            version: { type: integer, minimum: 1 }
            body: { type: string }
            author: { type: string, enum: [AI, USER] }
            flagged_reason: { type: string, nullable: true }
            quote_filled: { type: boolean }
            created_at: { type: string, format: date-time }
            sent_at: { type: string, format: date-time, nullable: true }
        events: { type: array, items: { $ref: "#/components/schemas/EnquiryEvent" } }

    EnquiryResponse:
      type: object
      required: [enquiry]
      properties: { enquiry: { $ref: "#/components/schemas/Enquiry" } }

    RouteEnquiryRequest:
      type: object
      required: [lane]
      additionalProperties: false
      properties:
        lane: { $ref: "#/components/schemas/Lane" }
        category: { $ref: "#/components/schemas/Category" }

    CorrectEnquiryRequest:
      type: object
      additionalProperties: false
      properties:
        check_in: { type: string, format: date }
        check_out: { type: string, format: date }
        adults: { type: integer, minimum: 1 }
        children: { type: integer, minimum: 0 }
        rooms: { type: integer, minimum: 1 }
        guest_count: { type: integer, minimum: 1 }

    EditDraftRequest:
      type: object
      required: [body]
      additionalProperties: false
      properties: { body: { type: string, minLength: 1, maxLength: 4000 } }

    EnquiryStatusRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties: { status: { $ref: "#/components/schemas/EnquiryStatus" } }

    Team: { type: string, enum: [GUEST, RESERVATIONS, SALES, GM, ADMIN], description: "Whose lane a role works, who gets alerts, the signature title." }

    Permission:
      type: object
      required: [key, group, label, description]
      properties: { key: { type: string }, group: { type: string }, label: { type: string }, description: { type: string } }

    Role:
      type: object
      required: [id, key, name, description, team, system, permissions, members]
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        team: { $ref: "#/components/schemas/Team" }
        system: { type: boolean, description: Administrator and Guest; fixed. }
        permissions: { type: array, items: { type: string } }
        members: { type: integer }

    AccessResponse:
      type: object
      required: [permissions, roles]
      properties:
        permissions: { type: array, items: { $ref: "#/components/schemas/Permission" } }
        roles: { type: array, items: { $ref: "#/components/schemas/Role" } }

    RoleRequest:
      type: object
      required: [name, team, permissions]
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string }
        team: { type: string, enum: [RESERVATIONS, SALES, GM] }
        permissions: { type: array, items: { type: string } }

    RoleResponse:
      type: object
      required: [role]
      properties: { role: { $ref: "#/components/schemas/Role" } }

    Member:
      type: object
      required: [id, email, name, phone, role_id, role_name, team, active, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        phone: { type: string, nullable: true }
        role_id: { type: string, format: uuid }
        role_name: { type: string }
        team: { $ref: "#/components/schemas/Team" }
        active: { type: boolean }
        created_at: { type: string, format: date-time }

    MembersResponse:
      type: object
      required: [members]
      properties: { members: { type: array, items: { $ref: "#/components/schemas/Member" } } }

    MemberResponse:
      type: object
      required: [member]
      properties: { member: { $ref: "#/components/schemas/Member" } }

    CreateMemberRequest:
      type: object
      required: [email, name, role_id, password]
      additionalProperties: false
      properties:
        email: { type: string }
        name: { type: string }
        phone: { type: string }
        role_id: { type: string, format: uuid }
        password: { type: string, minLength: 12 }

    UpdateMemberRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        phone: { type: string }
        role_id: { type: string, format: uuid }
        active: { type: boolean }
        password: { type: string, minLength: 12 }

    GmailStatus:
      type: object
      required: [configured, connected, account_email, connected_at, last_sync_at, last_error]
      properties:
        configured: { type: boolean, description: The server has a Google OAuth client. }
        connected: { type: boolean }
        account_email: { type: string, nullable: true }
        connected_at: { type: string, format: date-time, nullable: true }
        last_sync_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, nullable: true }

    GmailStatusResponse:
      type: object
      required: [gmail]
      properties: { gmail: { $ref: "#/components/schemas/GmailStatus" } }

    GmailConnectResponse:
      type: object
      required: [auth_url]
      properties: { auth_url: { type: string } }

    GmailSyncResponse:
      type: object
      required: [imported, gmail]
      properties:
        imported: { type: integer }
        gmail: { $ref: "#/components/schemas/GmailStatus" }

    ComposeRequest:
      type: object
      required: [to, subject, body]
      additionalProperties: false
      properties:
        to: { type: string, format: email }
        subject: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 4000 }

    OutboxMessageResponse:
      type: object
      required: [message]
      properties: { message: { $ref: "#/components/schemas/OutboxMessage" } }

    AnalyticsCount:
      type: object
      required: [key, count]
      properties: { key: { type: string }, count: { type: integer } }

    AnalyticsBreakdown:
      type: object
      required: [name, bookings, room_nights, revenue_paise]
      properties:
        name: { type: string }
        bookings: { type: integer }
        room_nights: { type: integer }
        revenue_paise: { $ref: "#/components/schemas/Paise" }

    AnalyticsResponse:
      type: object
      required: [range, kpis, daily, by_room, by_plan, by_display_currency, status_mix, lead_time, on_the_books, enquiries]
      properties:
        range:
          type: object
          required: [from, to]
          properties: { from: { type: string, format: date }, to: { type: string, format: date } }
        kpis:
          type: object
          required: [revenue_paise, room_revenue_paise, gst_paise, bookings, room_nights, adr_paise, avg_stay_nights, avg_lead_days,
            cancellation_rate, commission_saved_paise, avg_booking_value_paise, previous_revenue_paise, previous_bookings]
          properties:
            revenue_paise: { $ref: "#/components/schemas/Paise" }
            room_revenue_paise: { $ref: "#/components/schemas/Paise" }
            gst_paise: { $ref: "#/components/schemas/Paise" }
            bookings: { type: integer }
            room_nights: { type: integer }
            adr_paise: { $ref: "#/components/schemas/Paise" }
            avg_stay_nights: { type: number }
            avg_lead_days: { type: number }
            cancellation_rate: { type: number, nullable: true }
            commission_saved_paise: { $ref: "#/components/schemas/Paise" }
            avg_booking_value_paise: { $ref: "#/components/schemas/Paise" }
            previous_revenue_paise: { $ref: "#/components/schemas/Paise" }
            previous_bookings: { type: integer }
        daily:
          type: array
          items:
            type: object
            required: [date, bookings, revenue_paise]
            properties:
              date: { type: string, format: date }
              bookings: { type: integer }
              revenue_paise: { $ref: "#/components/schemas/Paise" }
        by_room: { type: array, items: { $ref: "#/components/schemas/AnalyticsBreakdown" } }
        by_plan: { type: array, items: { $ref: "#/components/schemas/AnalyticsBreakdown" } }
        by_display_currency:
          description: Confirmed bookings by the currency the guest read prices in (`name` is the code). All were charged in INR.
          type: array
          items: { $ref: "#/components/schemas/AnalyticsBreakdown" }
        status_mix: { type: array, items: { $ref: "#/components/schemas/AnalyticsCount" } }
        lead_time: { type: array, items: { $ref: "#/components/schemas/AnalyticsCount" } }
        on_the_books:
          type: array
          items:
            type: object
            required: [month, room_nights, room_revenue_paise, allotment, sold]
            properties:
              month: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
              room_nights: { type: integer }
              room_revenue_paise: { $ref: "#/components/schemas/Paise" }
              allotment: { type: integer }
              sold: { type: integer }
        enquiries:
          type: object
          required: [total, by_channel, by_category, converted, median_first_reply_minutes, ai_handled_rate]
          properties:
            total: { type: integer }
            by_channel: { type: array, items: { $ref: "#/components/schemas/AnalyticsCount" } }
            by_category: { type: array, items: { $ref: "#/components/schemas/AnalyticsCount" } }
            converted: { type: integer }
            median_first_reply_minutes: { type: number, nullable: true }
            ai_handled_rate: { type: number, nullable: true }

    RetentionResponse:
      type: object
      required: [result]
      properties:
        result:
          type: object
          required: [archived, anonymised, purged_after_tax_window, purged_unpaid, enquiries, outbox, notifications, holds, otps, sessions, housekeeping]
          properties:
            archived: { type: integer }
            anonymised: { type: integer }
            purged_after_tax_window: { type: integer }
            purged_unpaid: { type: integer }
            enquiries: { type: integer }
